name: Desktop Bridge modules
on:
  push:
    branches: [main, 'module/**']
  pull_request:
permissions:
  contents: read
jobs:
  protocol-and-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci --prefix bridge --ignore-scripts
      - run: npm test --prefix bridge
  universal-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python bridge/scripts/package-plugin.py --output release-output/desktop-bridge-plugin.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-bridge-universal-plugin
          path: release-output/desktop-bridge-plugin.zip*
