name: Desktop Bridge CI

on:
  pull_request:
    paths:
      - 'bridge/**'
      - 'plugin/**'
      - 'docs/**'
      - '.github/workflows/desktop-bridge-ci.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'plugin/**'
      - 'docs/**'
      - '.github/workflows/desktop-bridge-ci.yml'
  workflow_dispatch:
    inputs:
      run_hosted_cross_platform:
        description: 'Run Windows/macOS on GitHub-hosted runners (uses paid minutes after quota)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-bridge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Linux (inA) / Node 24
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ina-docker]
    timeout-minutes: 25

    steps:
      - name: Check out PR source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked server dependencies
        run: npm ci --prefix bridge

      - name: JavaScript tests (serial to avoid process interference)
        run: npm test --prefix bridge
        env:
          DESKTOP_BRIDGE_SUPPRESS_NOTIFICATIONS: '1'

      - name: Native installer tests
        run: python bridge/test/installers_test.py

      - name: Build full installer set on macOS
        if: runner.os == 'macOS'
        run: python bridge/scripts/package-downloads.py --output release-output/downloads

      - name: Upload unsigned test build (not a release)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bridge-0.2.6-ci-unsigned
          path: release-output/downloads/
          if-no-files-found: error
          retention-days: 7

  installer-smoke:
    name: Installer choice / Linux (inA)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ina-docker]
    timeout-minutes: 10
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native installers and explicit mode selection
        run: python bridge/test/installers_test.py

  test-hosted:
    name: Test ${{ matrix.os }} / Node 24
    if: github.event_name == 'workflow_dispatch' && inputs.run_hosted_cross_platform
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out PR source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked server dependencies
        run: npm ci --prefix bridge

      - name: JavaScript tests (serial to avoid process interference)
        run: npm test --prefix bridge
        env:
          DESKTOP_BRIDGE_SUPPRESS_NOTIFICATIONS: '1'

      - name: Native installer tests
        run: python bridge/test/installers_test.py

      - name: Build full installer set on macOS
        if: runner.os == 'macOS'
        run: python bridge/scripts/package-downloads.py --output release-output/downloads

      - name: Upload unsigned test build (not a release)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bridge-0.2.6-ci-unsigned
          path: release-output/downloads/
          if-no-files-found: error
          retention-days: 7

  installer-smoke-hosted:
    name: Installer choice / ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' && inputs.run_hosted_cross_platform
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native installers and explicit mode selection
        run: python bridge/test/installers_test.py
