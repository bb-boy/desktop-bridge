<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Bridge · 桌面截图</title>
<style>
  :root {color-scheme:light dark; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  * {box-sizing:border-box}
  body {margin:0; padding:12px; background:var(--app-background-color,Canvas); color:var(--app-text-color,CanvasText)}
  main {margin:auto; width:100%; max-width:1100px}
  header {display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:9px}
  h2 {font-size:14px; font-weight:600; margin:0}
  #details {font-size:12px; color:var(--app-secondary-text-color,GrayText); text-align:right}
  figure {margin:0; border:1px solid #8885; border-radius:10px; overflow:hidden; background:transparent}
  img {display:block; width:100%; max-width:100%; height:auto; aspect-ratio:auto}
  #status {border:1px dashed #8885; border-radius:10px; padding:24px 12px; text-align:center; color:var(--app-secondary-text-color,GrayText)}
  #status[data-error="true"] {color:#c44343}
  [hidden] {display:none!important}
</style>
</head>
<body>
<main>
  <header><h2>Desktop Bridge · 桌面截图</h2><span id="details"></span></header>
  <div id="status" role="status" aria-live="polite">正在接收截图…</div>
  <figure id="image-frame" hidden><img id="screenshot" alt="远程电脑桌面截图"></figure>
</main>
<script type="module">
  const status=document.querySelector('#status');
  const frame=document.querySelector('#image-frame');
  const screenshot=document.querySelector('#screenshot');
  const details=document.querySelector('#details');
  let nextRequestId=0;
  const pending=new Map();
  let hasImage=false;
  let recovering=false;
  let callId=typeof window.openai?.widgetState?.desktopBridgeCallId==='string'?window.openai.widgetState.desktopBridgeCallId:'';
  let ready=null;
  let lastReportedHeight=0;
  function resizeHost(){
    const height=Math.ceil(document.querySelector('main').getBoundingClientRect().height+24);
    if(!Number.isFinite(height)||height<=0||height>6000||Math.abs(height-lastReportedHeight)<2)return;
    lastReportedHeight=height;
    window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height}},'*');
    try{window.openai?.notifyIntrinsicHeight?.(height);}catch{}
  }
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(resizeHost).observe(document.querySelector('main'));
  window.addEventListener('resize',resizeHost);

  function showError(message) {
    if(hasImage)return;
    frame.hidden=true;
    screenshot.removeAttribute('src');
    status.hidden=false;
    status.dataset.error='true';
    status.textContent=message;
    details.textContent='';
    resizeHost();
  }
  function saveCallId(id){
    if(typeof id!=='string'||!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id))return;
    if(callId===id)return;
    callId=id;
    try{window.openai?.setWidgetState?.({desktopBridgeCallId:id});}catch{}
  }
  function validPicture(item){
    return item?.type==='image' &&
      ['image/png','image/jpeg','image/webp'].includes(item.mimeType) &&
      typeof item.data==='string' && item.data.length>0 && item.data.length<=12*1024*1024 &&
      /^[A-Za-z0-9+/]+={0,2}$/.test(item.data);
  }
  // ChatGPT retains the canonical MCP result envelope in widget metadata.
  // Prefer it on remount rather than reissuing a potentially large tools/call.
  function tryHostResult(){
    if(hasImage)return true;
    const bridge=window.openai;
    const envelope=bridge?.toolResponseMetadata;
    const candidates=[
      envelope?.mcp_tool_result,
      envelope?.call_tool_result?.result,
      envelope?.call_tool_result,
      envelope?.result,
      envelope
    ];
    for(const candidate of candidates){
      if(!candidate)continue;
      let value=candidate;
      if(typeof value==='string'){
        if(value.length>12*1024*1024)continue;
        try{value=JSON.parse(value);}catch{continue;}
      }
      if(!value||typeof value!=='object')continue;
      const result=value.content?value:value.result;
      const picture=result?.content?.find(validPicture);
      if(!picture)continue;
      saveCallId(result?.structuredContent?.desktopBridgeCallId??result?._meta?.desktopBridge?.callId??
        bridge?.toolOutput?.desktopBridgeCallId);
      renderPicture(picture,result.structuredContent??bridge?.toolOutput??{});
      return true;
    }
    return false;
  }
  function renderPicture(item,meta={}){
    hasImage=true;
    screenshot.onload=()=>{
      status.hidden=true;
      frame.hidden=false;
      resizeHost();
    };
    screenshot.onerror=()=>{
      hasImage=false;
      screenshot.removeAttribute('src');
      showError('截图已返回，但图片无法显示。');
    };
    screenshot.src='data:'+item.mimeType+';base64,'+item.data;
    const width=Number(meta.screenshot_width);
    const height=Number(meta.screenshot_height);
    details.textContent=Number.isFinite(width)&&Number.isFinite(height)&&width>0&&height>0?
      width+' × '+height+' px':'';
  }
  async function recoverScreenshot(){
    if(hasImage||recovering||!callId)return;
    recovering=true;
    status.hidden=false;
    status.dataset.error='false';
    status.textContent='正在恢复已保存的截图…';
    const id=callId;
    try{
      await ready;
      if(hasImage||tryHostResult())return;
      // Reuse the completed task; do not invoke CUA capture again.
      const response=await sendRequest('tools/call',{name:'get_call_result',arguments:{call_id:id}});
      if(response?.isError)throw new Error('Cached task unavailable');
      const raw=response?.content?.find(item=>item.type==='text')?.text;
      if(typeof raw!=='string'||raw.length>12*1024*1024)throw new Error('Invalid cached screenshot');
      const record=JSON.parse(raw);
      if(record.id!==id||record.tool!=='cua_get_desktop_state'||record.status!=='completed')throw new Error('Wrong screenshot task');
      const picture=record.result?.content?.find(validPicture);
      if(!picture)throw new Error('No cached image');
      if(!hasImage)renderPicture(picture,record.result.structuredContent??{});
    }catch{
      showError('无法恢复已保存的截图，请重新执行截图工具。');
    }finally{
      recovering=false;
    }
  }
  function showResult(result){
    if(result?.isError){
      showError(result.content?.find(item=>item.type==='text')?.text||'截图工具执行失败');
      return;
    }
    saveCallId(result?.structuredContent?.desktopBridgeCallId??result?._meta?.desktopBridge?.callId);
    const picture=result?.content?.find(validPicture);
    if(picture){
      if(!hasImage)renderPicture(picture,result.structuredContent??{});
      return;
    }
    if(hasImage||tryHostResult())return; // Partial notifications must not erase an image.
    saveCallId(window.openai?.toolOutput?.desktopBridgeCallId);
    if(callId){
      void recoverScreenshot();
    }else{
      showError('未收到可显示的截图图片，也没有可恢复的任务编号。');
    }
  }
  function sendRequest(method,params) {
    return new Promise((resolve,reject)=>{
      const id=++nextRequestId;
      pending.set(id,{resolve,reject});
      window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
    });
  }
  window.addEventListener('message',event=>{
    if(event.source!==window.parent || event.data?.jsonrpc!=='2.0')return;
    const message=event.data;
    if(typeof message.id==='number' && pending.has(message.id)) {
      const call=pending.get(message.id);
      pending.delete(message.id);
      if(message.error)call.reject(new Error(message.error.message||'初始化失败'));
      else call.resolve(message.result);
    }
    if(message.method==='ui/notifications/tool-result')showResult(message.params);
  });
  window.addEventListener('openai:set_globals',()=>{
    if(!hasImage)tryHostResult();
  });
  ready=(async()=>{
    try {
      await sendRequest('ui/initialize',{
        appInfo:{name:'desktop-bridge-screenshot',version:'1.1.0'},
        appCapabilities:{},protocolVersion:'2026-01-26'
      });
      window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');
      if(!tryHostResult()){
        saveCallId(window.openai?.toolOutput?.desktopBridgeCallId);
        if(callId&&!hasImage)void recoverScreenshot();
      }
    } catch {
      showError('截图界面初始化失败，请重新打开截图工具。');
    }
  })();
</script>
</body>
</html>
