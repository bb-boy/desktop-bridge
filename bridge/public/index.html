<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <meta name="description" content="Desktop Bridge — 管理设备、连接状态、授权与任务结果。">
  <title>Desktop Bridge · 我的电脑</title>
  <link rel="stylesheet" href="/vendor/nes.css/nes.min.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body class="dashboard pixel-dashboard">
  <a class="skip-link" href="#main">跳转到主要内容</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Desktop Bridge 首页">
        <span class="brand-mark pixel-brand" aria-hidden="true">DB</span>
        <span class="brand-name">Desktop <strong>Bridge</strong></span>
      </a>
      <span class="version">v0.2.3</span>
      <div class="account"><span id="account-name"></span><button id="logout" class="secondary nes-btn" type="button" hidden>退出登录</button></div>
    </div>
  </header>
  <main class="workspace" id="main">
    <p id="message" role="status" aria-live="polite"></p>
    <section id="login-panel" class="card login-shell nes-container">
      <div class="login-intro">
        <div class="pixel-signal" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1>Desktop<br><em>Bridge</em></h1>
        <div class="pixel-scene" aria-hidden="true"><div class="pixel-machine"><span></span></div><div class="pixel-link"></div><div class="pixel-cloud"><span></span></div></div>
      </div>
      <div class="login-form-panel">
        <h2>登录工作空间</h2>
        <button id="google-login" class="google-button wide nes-btn" type="button" hidden>使用 Google 登录</button>
        <form id="login-form">
          <label>账号<input class="nes-input" name="username" autocomplete="username" maxlength="48" required value="owner"></label>
          <label>密码<input class="nes-input" name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
          <button class="wide nes-btn is-success" type="submit">登录 <span aria-hidden="true">→</span></button>
        </form>
        <form id="signup-form" hidden>
          <label>账号<input class="nes-input" name="username" autocomplete="username" maxlength="48" minlength="3" required></label>
          <label>密码（至少 12 位）<input class="nes-input" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
          <button class="wide nes-btn is-success" type="submit">创建账号</button>
        </form>
        <section class="install-section"><h3>安装并连接</h3><div class="installer-links"><a class="button secondary nes-btn" href="/downloads/DesktopBridge-macOS.pkg" download>Mac 安装器</a><a class="button secondary nes-btn" href="/downloads/DesktopBridge-Windows.cmd" download>Windows 安装器</a><a class="button secondary nes-btn" href="/downloads/DesktopBridge-Linux.sh" download>Linux 安装器</a></div></section>
        <button id="toggle-login" class="secondary nes-btn" type="button" hidden>使用已有账号登录</button>
      </div>
    </section>
    <section id="app-panel" hidden>
      <div class="intro">
        <div><h1>我的电脑<span class="title-dot">.</span></h1></div>
        <div class="downloads"><a class="button nes-btn is-success" href="/downloads/desktop-bridge-plugin.zip">下载通用插件 ZIP <span aria-hidden="true">↗</span></a></div>
      </div>
      <div class="stats pixel-stats" aria-label="工作空间概览">
        <article class="nes-container"><span>已绑定设备</span><strong id="stat-total">—</strong></article>
        <article class="nes-container"><span>工具可用</span><strong id="stat-ready">—</strong></article>
        <article class="nes-container"><span>等待结果</span><strong id="stat-waiting">—</strong></article>
      </div>
      <nav class="tabs pixel-tabs" aria-label="管理页面" role="tablist">
        <button id="tab-devices" class="tab active" data-tab="devices" type="button" role="tab" aria-controls="devices-tab" aria-selected="true">设备</button>
        <button id="tab-calls" class="tab" data-tab="calls" type="button" role="tab" aria-controls="calls-tab" aria-selected="false">任务与结果</button>
        <button id="tab-authorizations" class="tab" data-tab="authorizations" type="button" role="tab" aria-controls="authorizations-tab" aria-selected="false">授权与账号</button>
      </nav>
      <section id="devices-tab" role="tabpanel" aria-labelledby="tab-devices">
        <div class="section-title"><div><h2>设备状态</h2></div><button id="refresh" class="secondary nes-btn" type="button">刷新状态</button></div>
        <div id="devices" class="device-grid"></div>
        <section class="pair-box nes-container" id="device-install">
          <div><h2>安装并连接</h2><div class="installer-links"><a class="button secondary nes-btn" href="/downloads/DesktopBridge-macOS.pkg" download>Mac 安装器</a><a class="button secondary nes-btn" href="/downloads/DesktopBridge-Windows.cmd" download>Windows 安装器</a><a class="button secondary nes-btn" href="/downloads/DesktopBridge-Linux.sh" download>Linux 安装器</a></div></div>
          <div class="pair-controls"><form id="pair-form"><label>设备配对码<input class="nes-input" name="code" id="pair-code" placeholder="ABCD-2345" maxlength="16" autocomplete="off" spellcheck="false" required></label><button class="wide nes-btn is-primary" type="submit">查看待绑定设备</button></form><div id="pair-preview" hidden></div></div>
        </section>
      </section>
      <section id="calls-tab" role="tabpanel" aria-labelledby="tab-calls" hidden>
        <div class="section-title"><div><h2>最近任务</h2></div></div><div id="calls"></div>
      </section>
      <section id="authorizations-tab" role="tabpanel" aria-labelledby="tab-authorizations" hidden>
        <div class="section-title"><div><h2>授权与账号</h2></div></div>
        <section class="pair-box account-section nes-container" id="google-panel" hidden><div><h3>Google 账号</h3><p id="google-status" class="muted"></p></div><div class="actions"><button id="google-link" type="button">绑定 Google 账号</button><button id="google-unlink" class="secondary nes-btn" type="button" hidden>解除绑定</button></div></section>
        <h3 class="list-heading">已授权的客户端</h3><div id="authorizations"></div>
        <section class="pair-box account-section nes-container" id="invite-panel" hidden><div><h3>邀请新用户</h3><p id="invite-link"></p></div><button id="invite" type="button">生成邀请链接</button></section>
        <section class="pair-box account-section nes-container"><div><h3>修改账号密码</h3></div><form id="password-form"><label>当前密码<input class="nes-input" name="currentPassword" type="password" required autocomplete="current-password"></label><label>新密码<input class="nes-input" name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><button type="submit">修改密码</button></form></section>
      </section>
    </section>
  </main>
  <dialog class="nes-dialog" id="result-dialog" aria-labelledby="result-heading"><div class="section-title"><div><h2 id="result-heading">任务结果</h2></div><button id="close-dialog" class="secondary nes-btn" type="button">关闭</button></div><pre id="result-content"></pre></dialog>
</body>
</html>
