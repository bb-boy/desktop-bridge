<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Isolated MCP Apps Host</title></head>
<body><iframe title="Device permissions" sandbox="allow-scripts allow-same-origin" src="/ui" style="width:720px;height:900px;border:0"></iframe>
<script>
const devices=[{id:"p111",name:"Windows p111"},{id:"mac",name:"MacBook Neo"}];
const tools={
 p111:[{name:"read_file",source:"desktop",annotations:{readOnlyHint:true}},{name:"start_process",source:"desktop",annotations:{readOnlyHint:false}},{name:"cua_list_windows",source:"cua",annotations:{readOnlyHint:true}},{name:"cua_click",source:"cua",annotations:{readOnlyHint:false}}],
 mac:[{name:"read_file",source:"desktop",annotations:{readOnlyHint:true}}]
};
const policies={
 p111:{device_id:"p111",mode:"full",allowed_tools:[],updated:null},
 mac:{device_id:"mac",mode:"read_only",allowed_tools:[],updated:200}
};
window._requests=[];
window._policies=policies;
window._rejectNext=false;
const snapshot=id=>({...policies[id],devices,tools:tools[id]});
window.addEventListener("message",event=>{
 const frame=document.querySelector("iframe");
 if(event.source!==frame.contentWindow)return;
 const request=event.data;
 if(request?.jsonrpc!=="2.0")return;
 if(request.method!=="ui/notifications/initialized")window._requests.push({method:request.method,params:request.params});
 if(request.id===undefined)return;
 let result;
 if(request.method==="ui/initialize"){
   result={protocolVersion:"2026-01-26",hostCapabilities:{},hostContext:{theme:"light"}};
 }else if(request.method==="tools/call"){
   const {name,arguments:args}=request.params;
   if(name==="get_device_permissions"){result={structuredContent:snapshot(args.device_id||"p111")};}
   else if(name==="set_device_permissions"){
     if(window._rejectNext){window._rejectNext=false;result={isError:true,content:[{type:"text",text:"Permission denied by server"}]};}
     else {
       policies[args.device_id]={device_id:args.device_id,mode:args.mode,allowed_tools:args.allowed_tools||[],updated:Date.now()};
       result={structuredContent:snapshot(args.device_id)};
     }
   }else{result={isError:true,content:[{type:"text",text:"Unknown tool"}]};}
 }else{result={};}
 frame.contentWindow.postMessage({jsonrpc:"2.0",id:request.id,result},"*");
});
</script></body></html>
